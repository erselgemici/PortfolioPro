# Render'ın ücretsiz planında site 15 dakika istek almazsa uykuya geçiyor ve ilk açılış ~1 dakika sürüyor.
# Bu iş 10 dakikada bir /ping adresini çağırıp siteyi uyanık tutuyor.
# NOT: /ping veritabanına gitmiyor, böylece veritabanı (Neon) boşta kalınca uyuyabiliyor ve ücretsiz kotası harcanmıyor.
name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Siteyi uyandır
        run: curl -fsS --max-time 90 https://erselgemici.com/ping || true
