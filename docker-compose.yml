# Tüm sistemi tek komutla ayağa kaldırır:  docker compose up -d --build
# Önce .env.example dosyasını .env olarak kopyalayıp içini doldur.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # NOT: Varsayılan sürüm Developer, canlıda kullanmak lisansa aykırı. Express ücretsiz ve küçük bir site için yeterli.
      MSSQL_PID: Express
      MSSQL_MEMORY_LIMIT_MB: 1536
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env dosyasında tanımlı olmalı}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # NOT: Veritabanı portu dışarı açık değil, sadece api container'ı erişebiliyor

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=db;Database=PortfolioProDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
      Jwt__Key: ${JWT_KEY:?JWT_KEY .env dosyasında tanımlı olmalı}
      Seed__AdminEmail: ${ADMIN_EMAIL}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
      Seed__AdminFullName: ${ADMIN_FULL_NAME:-Admin}
    volumes:
      - uploads:/app/wwwroot/uploads
    # API portu da dışarı açık değil, istekler nginx (web) üzerinden geliyor

  web:
    build: ./client
    restart: unless-stopped
    depends_on:
      - api
    # NOT: Dışarıya artık caddy açılıyor, web sadece docker ağı içinden erişilebilir

  # HTTPS: Caddy, Let's Encrypt sertifikasını kendisi alıp yeniliyor ve istekleri web'e iletiyor
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  sqldata:
  uploads:
  caddy_data:
  caddy_config:
