# Tüm sistemi tek komutla ayağa kaldırır:  docker compose up -d --build
# Önce .env.example dosyasını .env olarak kopyalayıp içini doldur.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfoliopro
      POSTGRES_USER: portfoliopro
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env dosyasında tanımlı olmalı}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfoliopro -d portfoliopro"]
      interval: 10s
      timeout: 5s
      retries: 10
    # NOT: Veritabanı portu dışarı açık değil, sadece uygulama container'ı erişebiliyor

  # Tek imaj: .NET API + derlenmiş Angular (kök dizindeki Dockerfile)
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=portfoliopro;Username=portfoliopro;Password=${DB_PASSWORD}"
      Jwt__Key: ${JWT_KEY:?JWT_KEY .env dosyasında tanımlı olmalı}
      Seed__AdminEmail: ${ADMIN_EMAIL}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
      Seed__AdminFullName: ${ADMIN_FULL_NAME:-Admin}
    # NOT: Uygulama portu dışarı açık değil, istekler Caddy üzerinden geliyor

  # HTTPS: Caddy, Let's Encrypt sertifikasını kendisi alıp yeniliyor ve istekleri uygulamaya iletiyor
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
