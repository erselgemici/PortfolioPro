# Tüm sistemi tek komutla ayağa kaldırır:  docker compose up -d --build
# Önce .env.example dosyasını .env olarak kopyalayıp içini doldur.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfoliopro
      POSTGRES_USER: portfoliopro
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env dosyasında tanımlı olmalı}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfoliopro -d portfoliopro"]
      interval: 10s
      timeout: 5s
      retries: 10
    # NOT: Veritabanı portu dışarı açık değil, sadece api container'ı erişebiliyor

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=portfoliopro;Username=portfoliopro;Password=${DB_PASSWORD}"
      Jwt__Key: ${JWT_KEY:?JWT_KEY .env dosyasında tanımlı olmalı}
      Seed__AdminEmail: ${ADMIN_EMAIL}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
      Seed__AdminFullName: ${ADMIN_FULL_NAME:-Admin}
    volumes:
      - uploads:/app/wwwroot/uploads
    # API portu da dışarı açık değil, istekler nginx (web) üzerinden geliyor

  web:
    build: ./client
    restart: unless-stopped
    depends_on:
      - api
    # NOT: Dışarıya artık caddy açılıyor, web sadece docker ağı içinden erişilebilir

  # HTTPS: Caddy, Let's Encrypt sertifikasını kendisi alıp yeniliyor ve istekleri web'e iletiyor
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
