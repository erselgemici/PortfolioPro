# Angular'ı servis eden ve /api isteklerini .NET API'ye ileten nginx ayarı.
# NOT: Site ve API aynı adresten (aynı origin) yayınlandığı için CORS'a gerek kalmıyor
# ve refresh token cookie'si SameSite=Strict ile sorunsuz çalışıyor.

# NOT: Önde Caddy var. Kullanıcı https ile geliyor ama Caddy buraya http ile bağlanıyor.
# Caddy'nin gönderdiği X-Forwarded-Proto'yu koruyoruz, yoksa API isteği http sanıyor.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;            # hata sayfalarında nginx versiyonunu gösterme
    client_max_body_size 6m;      # dosya yükleme sınırı (API'deki limitle uyumlu)

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- Güvenlik header'ları ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: sadece kendi domainimizden script çalışabilir. index.html'deki tema script'i hash ile izinli.
    # NOT: index.html'deki o script değişirse bu hash'i de güncellemek gerekiyor (README'de anlatıldı).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Bls/RCtw0oDRetFY4ZxtphYFs4VQSnreOrA2MBL7u5U='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ---- API ve yüklenen dosyalar -> .NET API container'ı ----
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Gerçek kullanıcı IP'si ve protokolü API'ye iletiliyor (rate limit IP'ye göre çalışıyor)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /uploads/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # ---- Angular dosyaları ----
    # İsminde hash olan dosyalar (main-ABC123.js) hiç değişmez, 1 yıl önbellekte kalabilir
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA: bilinmeyen tüm adresler index.html'e düşer, yönlendirmeyi Angular router yapar
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Bls/RCtw0oDRetFY4ZxtphYFs4VQSnreOrA2MBL7u5U='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
